<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Página no encontrada — Granja Piloño</title>
<style>
  /* Página mínima y autocontenida: sin fuentes ni CSS externos, para que
     un 404 nunca dependa de que otro archivo exista. Paleta de la casa. */
  :root { --crema:#F2ECDF; --tinta:#26221C; --teja:#B04628; }
  * { margin:0; box-sizing:border-box; }
  body {
    min-height:100svh; display:grid; place-items:center;
    background:var(--crema); color:var(--tinta);
    font-family:Georgia, 'Times New Roman', serif; text-align:center; padding:24px;
  }
  .num { font-size:clamp(90px,22vw,180px); line-height:1; color:var(--teja); letter-spacing:.04em; }
  h1 { font-size:clamp(22px,4vw,32px); margin:10px 0 14px; font-weight:normal; }
  p { max-width:44ch; margin:0 auto 26px; line-height:1.6; opacity:.85; }
  a.btn {
    display:inline-block; padding:14px 26px; border-radius:999px;
    background:var(--teja); color:var(--crema); text-decoration:none;
    font-family:Verdana, Geneva, sans-serif; font-size:14px; letter-spacing:.02em;
  }
  a.btn:hover, a.btn:focus-visible { filter:brightness(1.08); }
  .correo { display:block; margin-top:18px; font-size:13px; opacity:.7; }
  .correo a { color:inherit; }
</style>
</head>
<body>
<main>
  <p class="num" aria-hidden="true">404</p>
  <h1>Esta página no existe (o se ha movido)</h1>
  <p>Como en la finca: cada cosa está en su sitio. Volvemos al inicio y sigues desde ahí.</p>
  <a class="btn" href="/">Volver a la granja</a>
  <span class="correo">¿Nos falta algo? Escríbenos a <a href="mailto:hola@granjapilono.es">hola@granjapilono.es</a></span>
</main>
</body>
</html>
